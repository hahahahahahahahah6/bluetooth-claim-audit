[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bluetooth-claim-audit"
version = "0.1.0"
description = "Offline static audit of wireless device documentation against source"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
bluetooth-claim-audit = "bluetooth_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["bluetooth_claim_audit*"]
